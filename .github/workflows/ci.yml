name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: erp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      CI: 'true'
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/erp_test
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/erp_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck
        env:
          # The API project needs ~2.3 GB of heap to typecheck (Prisma + zod types); the default
          # ~2 GB limit makes it crash intermittently with "heap out of memory".
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Test (unit + integration against MySQL)
        run: pnpm test

      - name: Build
        run: pnpm build
